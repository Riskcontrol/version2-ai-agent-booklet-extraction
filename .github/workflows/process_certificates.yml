name: Process Certificates PDF
on:
  repository_dispatch:
    types: [process_certificates]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
concurrency:
  group: process-certificates-${{ github.event.client_payload.doc_id || github.run_id }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.make.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install pdfinfo
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Download source PDF
        run: |
          HTTP_CODE=$(curl -L --fail-with-body -w "%{http_code}" -o source.pdf "$SOURCE_URL" 2>&1 || true)
          # Validate the downloaded file starts with %PDF- magic bytes
          MAGIC=$(head -c 5 source.pdf 2>/dev/null || true)
          if [ "$MAGIC" != "%PDF-" ]; then
            echo "[download] ERROR: Downloaded file is not a valid PDF (got: $(head -c 20 source.pdf | cat -v))"
            echo "[download] HTTP code was: $HTTP_CODE"
            echo "[download] This usually means the signed download URL expired or the file was not a PDF when uploaded."
            exit 1
          fi
          echo "[download] PDF magic bytes OK, HTTP code: $HTTP_CODE"
        env:
          SOURCE_URL: ${{ github.event.client_payload.source_url }}
      - name: Probe pages
        id: probe
        run: |
          PAGES=$(pdfinfo source.pdf | awk -F: '/Pages/ {print $2}' | xargs)
          # Fallback: if pdfinfo fails or returns empty, default to 1 so the matrix is never empty
          if [ -z "$PAGES" ] || ! echo "$PAGES" | grep -qE '^[0-9]+$'; then
            echo "[probe] pdfinfo returned '${PAGES}', defaulting to 1"
            PAGES=1
          fi
          echo "total_pages=$PAGES" >> $GITHUB_OUTPUT
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-pdf
          path: source.pdf
          overwrite: true
      - name: Make matrix
        id: make
        run: |
          python - <<'PY'
          import os, json
          total = int(os.environ['TOTAL'])
          size = int(os.environ.get('SIZE','10'))
          single = (os.environ.get('SINGLE_CHUNK','true').lower() in ('1','true','yes'))
          pstart = 1
          pend = total
          if single:
              chunks = [{'start': pstart, 'end': pend}]
          else:
              chunks = [{'start': i+1, 'end': min(pend, i+size)} for i in range(pstart-1, pend, size)]
          out = json.dumps(chunks)
          print(out)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('matrix='+out+'\n')
          PY
        env:
          TOTAL: ${{ steps.probe.outputs.total_pages || '1' }}
          SIZE: ${{ github.event.client_payload.chunk_size || 10 }}
          SINGLE_CHUNK: ${{ github.event.client_payload.single_chunk || 'true' }}

  extract:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils libpoppler-cpp-dev
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download source artifact
        uses: actions/download-artifact@v5
        with:
          name: source-pdf
          path: .
      - name: Extract (certificate agent)
        env:
          SOURCE_FILE: source.pdf
          ORIGINAL_FILENAME: ${{ github.event.client_payload.original_filename }}
          GEMINI_API_KEY: ${{ secrets[github.event.client_payload.api_key_tier] || secrets.GEMINI_API_KEY_FREE_TIER_1 }}
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          CALLBACK_HMAC_SECRET: ${{ secrets.CALLBACK_HMAC_SECRET }}
          RESULT_UPLOAD_URL: ${{ github.event.client_payload.result_upload_url }}
          RESULT_UPLOAD_TOKEN: ${{ secrets.RESULT_UPLOAD_TOKEN }}
          DOC_ID: ${{ github.event.client_payload.doc_id }}
          DATE_RECEIVED: ${{ github.event.client_payload.date_received }}
          COMPLETED_DATE: ${{ github.event.client_payload.completed_date }}
          CLIENT_NAME: ${{ github.event.client_payload.client_name }}
          DPI: 240
        run: |
          python scripts/run_certificate_agent.py
          mkdir -p chunks
          base="$(basename "${ORIGINAL_FILENAME:-document.pdf}")"; base="${base%.*}"
          shopt -s nullglob
          files=(outputs/"${base}".*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "[extract] No output files found for base: ${base}"
            ls -la outputs || true
            exit 1
          fi
          for f in "${files[@]}"; do
            ext="${f##*.}"
            mv -- "$f" "chunks/${base}-p1-end.${ext}"
          done
      - name: Upload chunk artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chunks
          path: chunks/*

  aggregate:
    needs: [plan, extract]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download chunks
        uses: actions/download-artifact@v5
        with:
          path: chunks
          merge-multiple: true
      - name: "Preflight: list chunk CSVs"
        env:
          ORIGINAL_FILENAME: ${{ github.event.client_payload.original_filename }}
        run: |
          set -euo pipefail
          base="$(basename "${ORIGINAL_FILENAME:-document.pdf}")"
          base="${base%.*}"
          echo "[preflight] Base filename: $base"
          count=$(find chunks -type f -name "${base}-p*.csv" | wc -l | tr -d ' ')
          echo "[preflight] CSV chunk files found: $count"
          if [ "$count" -eq 0 ]; then
            echo "[preflight] No chunk CSV files found under ./chunks for base ${base}. Failing fast."
            find chunks -maxdepth 2 -type f | head -n 50 || true
            exit 1
          fi
      - name: "Preflight: connectivity check (5s timeout)"
        env:
          RESULT_UPLOAD_URL: ${{ github.event.client_payload.result_upload_url || 'https://search.riskcontrolnigeria.com/api/github/upload-results' }}
          RESULT_UPLOAD_TOKEN: ${{ secrets.RESULT_UPLOAD_TOKEN }}
          CALLBACK_URL: ${{ github.event.client_payload.callback_url || 'https://search.riskcontrolnigeria.com/api/github/callback' }}
        run: |
          set -euo pipefail
          check_post() {
            local url="$1"; shift
            local extra_headers=("$@")
            echo "[preflight] Checking POST connectivity: ${url}"
            code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST -m 5 --connect-timeout 5 \
                   -H "Content-Type: application/json" "${extra_headers[@]}" \
                   -d '{"preflight":true,"source":"github-actions"}' "$url" || echo "curl_error")
            if [ "$code" = "curl_error" ]; then
              echo "[preflight] Connection to ${url} failed. Failing fast."
              exit 1
            fi
            echo "[preflight] ${url} responded HTTP ${code}."
          }
          if [ -n "${RESULT_UPLOAD_URL:-}" ]; then
            if [ -n "${RESULT_UPLOAD_TOKEN:-}" ]; then
              check_post "${RESULT_UPLOAD_URL}" -H "Authorization: Bearer ${RESULT_UPLOAD_TOKEN}"
            else
              check_post "${RESULT_UPLOAD_URL}"
            fi
          fi
          if [ -n "${CALLBACK_URL:-}" ]; then
            check_post "${CALLBACK_URL}"
          fi
      - name: Aggregate and upload
        env:
          ORIGINAL_FILENAME: ${{ github.event.client_payload.original_filename }}
          CALLBACK_URL: ${{ github.event.client_payload.callback_url || 'https://search.riskcontrolnigeria.com/api/github/callback' }}
          CALLBACK_HMAC_SECRET: ${{ secrets.CALLBACK_HMAC_SECRET }}
          RESULT_UPLOAD_URL: ${{ github.event.client_payload.result_upload_url || 'https://search.riskcontrolnigeria.com/api/github/upload-results' }}
          RESULT_UPLOAD_TOKEN: ${{ secrets.RESULT_UPLOAD_TOKEN }}
          DOC_ID: ${{ github.event.client_payload.doc_id }}
          EXTRACTION_TYPE: certificates
          CLIENT_NAME: ${{ github.event.client_payload.client_name }}
          DATE_RECEIVED: ${{ github.event.client_payload.date_received }}
          COMPLETED_DATE: ${{ github.event.client_payload.completed_date }}
          AGG_SKIP_DOCX: 'true'
          AGG_MAX_DOCX_ROWS: 0
        run: |
          python scripts/aggregate_results.py
          # Write aggregated counts to a file so the finalize step can read them
          python - <<'PY'
          import json, os, glob
          rows = 0
          orig = os.environ.get('ORIGINAL_FILENAME', 'document.pdf')
          base = os.path.splitext(os.path.basename(orig))[0]
          for f in glob.glob(f'outputs/{base}*.csv'):
              try:
                  import csv
                  with open(f) as fh:
                      rows = sum(1 for _ in csv.reader(fh)) - 1
              except Exception:
                  pass
          with open(os.environ['GITHUB_ENV'], 'a') as fh:
              fh.write(f'AGG_PAGES_WITH_RESULTS={max(0, rows)}\n')
          PY
      - name: Finalize billing with Peldarg (direct — independent of RCS config)
        if: ${{ github.event.client_payload.partner_request_id != '' && github.event.client_payload.partner_request_id != null }}
        env:
          PELDARG_BASE_URL: ${{ secrets.PELDARG_BASE_URL }}
          PELDARG_PARTNER_TOKEN: ${{ secrets.PELDARG_PARTNER_TOKEN }}
          PELDARG_PARTNER_NAME: ${{ secrets.PELDARG_PARTNER_NAME }}
          PELDARG_PARTNER_SIGNATURE_SECRET: ${{ secrets.PELDARG_PARTNER_SIGNATURE_SECRET }}
          PARTNER_REQUEST_ID: ${{ github.event.client_payload.partner_request_id }}
          FINALIZE_STATUS: 'success'
          PAGES_PROCESSED: ${{ github.event.client_payload.page_end || 0 }}
          PAGES_WITH_RESULTS: ${{ env.AGG_PAGES_WITH_RESULTS }}
        run: python scripts/peldarg_finalize.py
      - name: Upload final artifacts
        uses: actions/upload-artifact@v4
        with:
          name: outputs
          path: outputs/*
          overwrite: true

  # ── Failure notification ────────────────────────────────────────────────────
  # Runs ONLY when plan, extract, or aggregate jobs fail.
  # Notifies RCS (marks doc failed → frontend updates) and Peldarg (refunds credits).
  on_failure:
    needs: [plan, extract, aggregate]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install requests
        run: python -m pip install --quiet requests
      - name: Notify RCS of failure (marks document failed, frontend updates)
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_url || 'https://search.riskcontrolnigeria.com/api/github/callback' }}
          CALLBACK_HMAC_SECRET: ${{ secrets.CALLBACK_HMAC_SECRET }}
          DOC_ID: ${{ github.event.client_payload.doc_id }}
          ORIGINAL_FILENAME: ${{ github.event.client_payload.original_filename }}
        run: |
          python - <<'PY'
          import hashlib, hmac, json, os, requests
          url = os.environ.get('CALLBACK_URL', '').strip()
          secret = os.environ.get('CALLBACK_HMAC_SECRET', '').strip()
          if not url:
              print('[on_failure] CALLBACK_URL not set — skipping RCS notification')
              raise SystemExit(0)
          payload = json.dumps({
              'status': 'failed',
              'doc_id': os.environ.get('DOC_ID', ''),
              'filename': os.environ.get('ORIGINAL_FILENAME', ''),
              'failed_reason': 'GitHub Actions workflow failed (see run logs)',
              'pages_processed': 0,
              'pages_with_results': 0,
          }).encode('utf-8')
          headers = {'Content-Type': 'application/json'}
          if secret:
              headers['X-Extractor-Signature'] = hmac.new(secret.encode(), payload, hashlib.sha256).hexdigest()
          try:
              r = requests.post(url, data=payload, headers=headers, timeout=30)
              print(f'[on_failure] RCS callback HTTP {r.status_code}')
          except Exception as e:
              print(f'[on_failure] RCS callback error: {repr(e)}')
          PY
      - name: Notify Peldarg of failure (refunds reserved credits)
        if: ${{ github.event.client_payload.partner_request_id != '' && github.event.client_payload.partner_request_id != null }}
        env:
          PELDARG_BASE_URL: ${{ secrets.PELDARG_BASE_URL }}
          PELDARG_PARTNER_TOKEN: ${{ secrets.PELDARG_PARTNER_TOKEN }}
          PELDARG_PARTNER_NAME: ${{ secrets.PELDARG_PARTNER_NAME }}
          PELDARG_PARTNER_SIGNATURE_SECRET: ${{ secrets.PELDARG_PARTNER_SIGNATURE_SECRET }}
          PARTNER_REQUEST_ID: ${{ github.event.client_payload.partner_request_id }}
          FINALIZE_STATUS: 'failed'
          PAGES_PROCESSED: '0'
          PAGES_WITH_RESULTS: '0'
          FAILED_REASON: 'GitHub Actions workflow failed'
        run: python scripts/peldarg_finalize.py
